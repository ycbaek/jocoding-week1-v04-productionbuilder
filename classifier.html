<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 vs 강아지 판별기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: safe center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            color: #fff;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0b0;
            margin-bottom: 28px;
            font-size: 1.05rem;
        }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 28px 20px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(255, 255, 255, 0.04);
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.08);
        }

        .dropzone-hint {
            color: #c8c8d8;
            font-size: 1rem;
            line-height: 1.6;
        }

        .dropzone-hint .accent { color: #e94560; font-weight: 600; }
        .dropzone-hint small { color: #7a7a8c; font-size: 0.85rem; }

        #preview {
            display: none;
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 16px;
        }

        .status {
            margin-top: 20px;
            min-height: 1.4em;
            color: #a0a0b0;
            font-size: 0.95rem;
        }
        .status.error { color: #e94560; }

        .results {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .result-row {
            text-align: left;
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .result-label {
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .result-label.top .badge {
            margin-left: 8px;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 50px;
            background: linear-gradient(135deg, #e94560, #c23616);
        }

        .result-pct {
            color: #c8c8d8;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .bar-track {
            height: 12px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 50px;
            background: linear-gradient(135deg, #9c88ff, #8c7ae6);
            transition: width 0.4s ease;
        }
        .bar-fill.top {
            background: linear-gradient(135deg, #e94560, #c23616);
        }

        .btn {
            margin-top: 28px;
            background: linear-gradient(135deg, #e94560, #c23616);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.6);
        }
        .btn:disabled {
            background: #3a3b5c;
            color: #8a8baf;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>고양이 vs 강아지</h1>
        <p class="subtitle">동물 사진을 올리면 AI가 판별해요</p>

        <div class="dropzone" id="dropzone">
            <div class="dropzone-hint" id="hint">
                <span class="accent">사진을 선택</span>하거나<br>여기로 끌어다 놓으세요<br>
                <small>JPG · PNG · GIF</small>
            </div>
            <img id="preview" alt="업로드한 이미지 미리보기">
        </div>

        <input type="file" id="fileInput" accept="image/*" hidden>

        <div class="status" id="status">모델을 불러오는 중...</div>

        <div class="results" id="results"></div>

        <button class="btn" id="pickBtn" disabled>다른 사진 올리기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/293SgEtQ9/";

        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const hint = document.getElementById("hint");
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");
        const pickBtn = document.getElementById("pickBtn");

        let model = null;

        function setStatus(text, isError = false) {
            statusEl.textContent = text;
            statusEl.classList.toggle("error", isError);
        }

        // Load the Teachable Machine model up front so the first prediction is instant.
        async function loadModel() {
            try {
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
                setStatus("사진을 올려보세요!");
                pickBtn.disabled = false;
            } catch (err) {
                setStatus("모델을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", true);
            }
        }

        // Run the image through the model and render a sorted bar for each class.
        async function classify() {
            if (!model) return;
            setStatus("판별 중...");

            const predictions = await model.predict(preview);
            predictions.sort((a, b) => b.probability - a.probability);

            resultsEl.innerHTML = predictions.map((p, i) => {
                const pct = (p.probability * 100).toFixed(1);
                const topClass = i === 0 ? "top" : "";
                const badge = i === 0 ? '<span class="badge">가장 유력</span>' : "";
                return `
                    <div class="result-row">
                        <div class="result-head">
                            <span class="result-label ${topClass}">${p.className}${badge}</span>
                            <span class="result-pct">${pct}%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill ${topClass}" style="width:${pct}%"></div>
                        </div>
                    </div>`;
            }).join("");

            const best = predictions[0];
            setStatus(`이 사진은 "${best.className}" 같아요 (${(best.probability * 100).toFixed(0)}%)`);
        }

        function handleFile(file) {
            if (!model) return;
            if (!file || !file.type.startsWith("image/")) {
                setStatus("이미지 파일을 올려주세요.", true);
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                preview.onload = classify;
                preview.src = reader.result;
                preview.style.display = "block";
                hint.style.display = "none";
            };
            reader.readAsDataURL(file);
        }

        // --- wiring ---
        dropzone.addEventListener("click", () => model && fileInput.click());
        pickBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        ["dragenter", "dragover"].forEach(evt =>
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.add("dragover");
            })
        );
        ["dragleave", "drop"].forEach(evt =>
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.remove("dragover");
            })
        );
        dropzone.addEventListener("drop", (e) => {
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });

        loadModel();
    </script>
</body>
</html>
