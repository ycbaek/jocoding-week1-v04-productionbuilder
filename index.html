<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 점심 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>오늘 점심 뭐 먹지?</h1>
        <p class="subtitle">고민하지 말고 뽑으세요!</p>

        <div class="categories" id="categories"></div>

        <div class="menu-card" id="menuCard"></div>

        <button class="btn" id="recommendBtn" onclick="recommend()">메뉴 추천</button>

        <div class="history" id="historySection" style="display:none;">
            <h3>최근 추천</h3>
            <div id="history"></div>
        </div>

        <div class="classifier">
            <h3>고양이 vs 강아지 판별</h3>
            <p class="classifier-desc">동물 사진을 올리면 AI가 판별해요</p>

            <div class="dropzone" id="dropzone">
                <div class="dropzone-hint" id="dropHint">
                    <span class="accent">사진을 선택</span>하거나 여기로 끌어다 놓으세요<br>
                    <small>JPG · PNG · GIF</small>
                </div>
                <img id="preview" alt="업로드한 이미지 미리보기">
            </div>

            <input type="file" id="fileInput" accept="image/*" hidden>

            <div class="classifier-status" id="classifierStatus">모델을 불러오는 중...</div>
            <div class="results" id="results"></div>
        </div>

        <div class="request">
            <h3>메뉴 추가 요청</h3>
            <p class="request-desc">먹고 싶은 메뉴가 없나요? 알려주세요!</p>

            <form id="requestForm" action="https://formspree.io/f/mvzekkvj" method="POST">
                <input type="email" name="email" placeholder="이메일 (답장 받을 주소)" required>
                <input type="text" name="menu" placeholder="추가하고 싶은 메뉴" required>
                <textarea name="message" rows="3" placeholder="하고 싶은 말 (선택)"></textarea>
                <button type="submit" class="btn btn-secondary" id="requestBtn">요청 보내기</button>
            </form>

            <p class="form-status" id="formStatus"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
